<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ytdlpgrab</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>ytdlpgrab</h1>
    <div class="status">
      <span id="dot" class="dot pending"></span>
      <span id="status">Checking helper...</span>
    </div>
    <div id="detail" class="detail"></div>
    <section class="current-video" aria-labelledby="download-current">
      <button id="download-current" type="button" disabled>
        Checking current tab...
      </button>
      <p id="current-detail" class="current-detail">
        Open a YouTube video to download what you are watching.
      </p>
      <p id="action-status" class="action-status" role="status" aria-live="polite"></p>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
