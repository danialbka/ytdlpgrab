<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ytdlpgrab</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-width: 300px;
        padding: 14px;
      }

      h1 {
        font-size: 15px;
        line-height: 1.2;
        margin: 0 0 10px;
      }

      .status {
        align-items: center;
        display: flex;
        gap: 8px;
        font-size: 13px;
        min-height: 22px;
      }

      .dot {
        border-radius: 999px;
        display: inline-block;
        flex: 0 0 auto;
        height: 9px;
        width: 9px;
      }

      .dot.pending {
        background: #f59e0b;
      }

      .dot.ok {
        background: #10b981;
      }

      .dot.warn {
        background: #f59e0b;
      }

      .dot.bad {
        background: #ef4444;
      }

      .detail {
        color: color-mix(in srgb, CanvasText 66%, transparent);
        font-size: 12px;
        line-height: 1.35;
        margin-top: 10px;
      }

      .current-video {
        border-top: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
        margin-top: 14px;
        padding-top: 14px;
      }

      button {
        background: #ff0033;
        border: 0;
        border-radius: 8px;
        color: white;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        padding: 10px 12px;
        width: 100%;
      }

      button:hover:not(:disabled) {
        background: #dc002c;
      }

      button:focus-visible {
        outline: 2px solid Highlight;
        outline-offset: 2px;
      }

      button:disabled {
        cursor: default;
        opacity: 0.48;
      }

      .current-detail,
      .action-status {
        color: color-mix(in srgb, CanvasText 66%, transparent);
        font-size: 12px;
        line-height: 1.35;
        margin: 8px 0 0;
      }

      .action-status:empty {
        display: none;
      }

      .action-status.error {
        color: #ef4444;
      }

      .action-status.success {
        color: #10b981;
      }
    </style>
  </head>
  <body>
    <h1>ytdlpgrab</h1>
    <div class="status">
      <span id="dot" class="dot pending"></span>
      <span id="status">Checking helper...</span>
    </div>
    <div id="detail" class="detail"></div>
    <section class="current-video" aria-labelledby="download-current">
      <button id="download-current" type="button" disabled>
        Checking current tab...
      </button>
      <p id="current-detail" class="current-detail">
        Open a YouTube video to download what you are watching.
      </p>
      <p id="action-status" class="action-status" role="status" aria-live="polite"></p>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
